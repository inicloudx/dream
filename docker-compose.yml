services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wish
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: wish
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wish -d wish"]
      interval: 3s
      timeout: 3s
      retries: 20

  viewer:
    build: ./services/viewer
    environment:
      DATABASE_URL: postgres://wish:${DB_PASSWORD}@db:5432/wish
      STATS_PASSWORD: ${STATS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4100:3000"

volumes:
  dbdata:
